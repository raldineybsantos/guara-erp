# Sobe o ERP completo: aplicação web + PostgreSQL + pgAdmin + agendador da régua de cobrança.
# Uso:  cp .env.example .env   (edite as senhas)   e depois   docker compose up -d
#
# PORTAS EXPOSTAS (ver seção Segurança do README):
#   8000  ERP (HTTP)            -> rede local. Use o perfil "https" para criptografar.
#   5050  pgAdmin               -> somente 127.0.0.1 (o próprio servidor) por padrão.
#   5432  PostgreSQL            -> NÃO exposta; só os containers acessam pela rede interna.
#   443/80 Caddy (opcional)     -> docker compose --profile https up -d
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      # superusuário do PostgreSQL: usado apenas para administração (pgAdmin), nunca pelo ERP
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?defina POSTGRES_ADMIN_PASSWORD no .env}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      # usuário e banco da aplicação (sem privilégios de superusuário) criados por docker/initdb
      ERP_DB: ${POSTGRES_DB:-erp}
      ERP_USER: ${POSTGRES_USER:-erp}
      ERP_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    networks: [interna]
    # sem "ports": o banco não fica acessível fora do Docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8000}:8000"
    volumes:
      - media:/app/media
    networks: [interna]

  agendador:
    # Executa a régua de cobrança todo dia às 08:00 (horário de Brasília)
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      SOMENTE_AGUARDAR_BANCO: "1"
    depends_on:
      - web
    command: ["python", "manage.py", "agendador", "--hora", "08:00"]
    networks: [interna]

  pgadmin:
    image: dpage/pgadmin4:8
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@empresa.com.br}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?defina PGADMIN_PASSWORD no .env}
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
      PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED: "False"
    volumes:
      - pgadmin:/var/lib/pgadmin
      - ./docker/pgadmin-servers.json:/pgadmin4/servers.json:ro
    ports:
      # Só acessível no próprio servidor. Para liberar na rede: PGADMIN_BIND=0.0.0.0 no .env
      - "${PGADMIN_BIND:-127.0.0.1}:${PGADMIN_PORT:-5050}:80"
    depends_on:
      - db
    networks: [interna]

  https:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on:
      - web
    networks: [interna]

networks:
  interna:

volumes:
  pgdata:
  media:
  pgadmin:
  caddy:
