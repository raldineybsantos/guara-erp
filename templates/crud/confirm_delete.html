{% extends "base.html" %}
{% block content %}
<div class="card border-danger" style="max-width:600px">
  <div class="card-body">
    <h2 class="h5"><i class="bi bi-exclamation-triangle text-danger me-2"></i>Excluir {{ titulo_singular|lower }}</h2>
    <p>Tem certeza que deseja excluir <strong>{{ object }}</strong>? Esta ação não pode ser desfeita.</p>
    <form method="post">{% csrf_token %}
      <button class="btn btn-danger">Excluir</button>
      <a href="{{ object.get_absolute_url }}" class="btn btn-outline-secondary">Cancelar</a>
    </form>
  </div>
</div>
{% endblock %}
