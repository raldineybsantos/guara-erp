{% extends "base.html" %}
{% block content %}
<form method="post" {% if multipart %}enctype="multipart/form-data"{% endif %} novalidate style="max-width:900px">
  {% csrf_token %}
  {% if aviso %}<div class="alert alert-warning">{{ aviso }}</div>{% endif %}
  <div class="card mb-3"><div class="card-body">{% include "crud/_campos.html" %}</div></div>
  <button class="btn btn-primary"><i class="bi bi-check-lg"></i> Confirmar</button>
  <a href="javascript:history.back()" class="btn btn-outline-secondary">Voltar</a>
</form>
{% endblock %}
