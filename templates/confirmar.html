{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:640px">
  <div class="card-body">
    <p class="mb-3">{{ mensagem }}</p>
    <form method="post">{% csrf_token %}
      <button class="btn btn-primary"><i class="bi bi-check-lg"></i> Confirmar</button>
      <a href="{{ voltar|default:'/' }}" class="btn btn-outline-secondary">Voltar</a>
    </form>
  </div>
</div>
{% endblock %}
