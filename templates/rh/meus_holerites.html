{% extends "base.html" %}
{% block content %}
<div class="list-group">
  {% for h in holerites %}<a class="list-group-item list-group-item-action d-flex justify-content-between" href="{{ h.get_absolute_url }}">
    <span>{{ h.folha }}</span><strong>R$ {{ h.liquido }}</strong></a>
  {% empty %}<div class="list-group-item text-secondary">Nenhum holerite disponível.</div>{% endfor %}
</div>
{% endblock %}
