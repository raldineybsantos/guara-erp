{% extends "crud/detail.html" %}
{% load static %}{% block depois_detalhe %}
{% if object.pix_copia_cola %}
<div class="card mb-3"><div class="card-header bg-body"><strong>PIX copia-e-cola</strong></div>
  <div class="card-body d-flex flex-wrap gap-4 align-items-center">
    <div id="qrcode"></div>
    <div class="flex-grow-1" style="min-width:250px">
      <div class="pix-box p-2 bg-body-tertiary rounded mb-2" id="pix">{{ object.pix_copia_cola }}</div>
      <button class="btn btn-sm btn-outline-primary" data-copiar="#pix"><i class="bi bi-clipboard"></i> Copiar</button>
    </div>
  </div>
</div>
{% endif %}
{% endblock %}
{% block scripts %}
{% if object.pix_copia_cola %}
<script src="{% static 'vendor/qrcodejs/qrcode.min.js' %}"></script>
<script>new QRCode(document.getElementById("qrcode"), { text: document.getElementById("pix").textContent.trim(), width: 180, height: 180 });</script>
{% endif %}
{% endblock %}
