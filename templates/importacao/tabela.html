{% extends "base.html" %}
{% block content %}
<form method="post" style="max-width:700px">{% csrf_token %}
  <div class="card mb-3"><div class="card-body">
    <p class="mb-2">Origem: <strong>{{ imp.descricao }}</strong>. Qual tabela/planilha importar? (Uma por vez; repita para as outras.)</p>
    {% for n in nomes %}<div class="form-check"><input class="form-check-input" type="radio" name="tabela" id="t{{ forloop.counter }}" value="{{ n }}" {% if forloop.first %}checked{% endif %}><label class="form-check-label" for="t{{ forloop.counter }}">{{ n }}</label></div>{% endfor %}
  </div></div>
  <button class="btn btn-primary">Ler esta tabela</button>
  <a href="{% url 'importacao:lista' %}" class="btn btn-outline-secondary">Cancelar</a>
</form>
{% endblock %}
